[project]
name = "evoid-plugins"
version = "0.1.0"
description = "Official plugin collection for EVOID runtime"
requires-python = ">=3.12"
license = "MIT"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
evoid-di = { workspace = true }
evoid-base = { workspace = true }
evoid-auth = { workspace = true }
evoid-cluster = { workspace = true }
evoid-dashboard = { workspace = true }
evoid-godot = { workspace = true }
evoid-maubot = { workspace = true }
evoid-postgresql = { workspace = true }
evoid-redis = { workspace = true }
evoid-scheduler = { workspace = true }
evoid-scylla = { workspace = true }
evoid-smart-storage = { workspace = true }
evoid-sqlite = { workspace = true }
evoid-tasks = { workspace = true }
evoid-transport = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests"]
